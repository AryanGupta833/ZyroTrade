services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: zyrotrade
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - zyrotrade-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zyrotrade
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-create-drop}
      TRADING_MAX_PRICE_AGE_SECONDS: ${TRADING_MAX_PRICE_AGE_SECONDS:-120}
      LEDGER_CURRENCY: ${LEDGER_CURRENCY:-INR}
      FINNHUB_CONNECT_TIMEOUT_MS: ${FINNHUB_CONNECT_TIMEOUT_MS:-2000}
      FINNHUB_READ_TIMEOUT_MS: ${FINNHUB_READ_TIMEOUT_MS:-3000}
      FINNHUB_RETRY_ATTEMPTS: ${FINNHUB_RETRY_ATTEMPTS:-2}
      FINNHUB_CIRCUIT_FAILURE_THRESHOLD: ${FINNHUB_CIRCUIT_FAILURE_THRESHOLD:-5}
      FINNHUB_CIRCUIT_OPEN_SECONDS: ${FINNHUB_CIRCUIT_OPEN_SECONDS:-30}
      OUTBOX_POLL_DELAY_MS: ${OUTBOX_POLL_DELAY_MS:-5000}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  zyrotrade-mysql:
