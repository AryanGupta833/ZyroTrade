spring.application.name=ZyroTrade
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zyrotrade}
spring.datasource.username=${DB_USERNAME:zyrotrade}
spring.datasource.password=${DB_PASSWORD}

finhub.api.key=${FINNHUB_API_KEY:}
jwt.secret=${JWT_SECRET:}
trading.max-price-age-seconds=${TRADING_MAX_PRICE_AGE_SECONDS:120}
ledger.currency=${LEDGER_CURRENCY:INR}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator
management.metrics.tags.application=${spring.application.name}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
finhub.connect-timeout-ms=${FINNHUB_CONNECT_TIMEOUT_MS:2000}
finhub.read-timeout-ms=${FINNHUB_READ_TIMEOUT_MS:3000}
finhub.retry-attempts=${FINNHUB_RETRY_ATTEMPTS:2}
finhub.circuit-failure-threshold=${FINNHUB_CIRCUIT_FAILURE_THRESHOLD:5}
finhub.circuit-open-seconds=${FINNHUB_CIRCUIT_OPEN_SECONDS:30}
outbox.poll-delay-ms=${OUTBOX_POLL_DELAY_MS:5000}
spring.task.scheduling.pool.size=4
